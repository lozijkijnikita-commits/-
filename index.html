<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Для Лейли</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    background-color: #0b0b0d;
    color: #e6e6e6;
    font-family: 'Montserrat', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .glow {
    position: absolute;
    width: 80vw;
    height: 80vw;
    max-width: 400px;
    max-height: 400px;
    background: radial-gradient(circle, rgba(212,175,155,0.08) 0%, rgba(0,0,0,0) 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  /* ===== ПАДАЮЩИЕ СЛОВА ===== */
  #falling-words {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
  }

  .falling-word {
    position: absolute;
    top: -60px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    color: #d8c8bd;
    white-space: nowrap;
    animation: fall linear forwards;
    text-shadow: 0 0 12px rgba(216, 200, 189, 0.15);
  }

  @keyframes fall {
    0% {
      transform: translateY(0) translateX(0) rotate(var(--rotate));
      opacity: 0;
    }
    8% {
      opacity: var(--opacity);
    }
    85% {
      opacity: var(--opacity);
    }
    100% {
      transform: translateY(115vh) translateX(var(--drift)) rotate(var(--rotate));
      opacity: 0;
    }
  }

  /* ===== ЭКРАН 1 ===== */
  #start-screen {
    text-align: center;
    z-index: 10;
    transition: opacity 0.8s ease;
    padding: 20px;
    width: 100%;
  }

  .subtitle {
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #888888;
    margin-bottom: 16px;
    font-weight: 300;
  }

  .title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(36px, 8vw, 52px);
    font-weight: 300;
    letter-spacing: 2px;
    color: #f0e6df;
    margin-bottom: 32px;
  }

  .btn {
    background: transparent;
    border: 1px solid rgba(240, 230, 223, 0.3);
    color: #d8c8bd;
    padding: 14px 38px;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-family: 'Montserrat', sans-serif;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.4s ease;
  }

  .btn:active {
    background: rgba(255, 255, 255, 0.08);
  }

  /* ===== ЭКРАН 2 ===== */
  #content-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.2s ease;
    padding: 20px 16px;
    z-index: 10;
  }

  #content-screen.active {
    opacity: 1;
    pointer-events: auto;
  }

  .photo-wrapper {
    position: relative;
    width: min(75vw, 290px);
    aspect-ratio: 3 / 4;
    border-radius: 2px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.85);
    flex-shrink: 0;
  }

  .photo-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(100%) contrast(110%) brightness(95%);
    display: block;
  }

  .mosaic-grid {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(10, 1fr);
  }

  .mosaic-tile {
    background-color: #0b0b0d;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
  }

  .mosaic-tile.hide {
    opacity: 0;
    transform: scale(0.2) rotate(6deg);
  }

  .message-box {
    text-align: center;
    opacity: 0;
    transform: translateY(16px);
    transition: all 1s ease 0.6s;
    margin-top: 24px;
    max-width: 340px;
    width: 100%;
  }

  .message-box.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .message-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(24px, 6vw, 32px);
    font-weight: 400;
    color: #e5d5cb;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }

  .line {
    width: 24px;
    height: 1px;
    background: rgba(229, 213, 203, 0.3);
    margin: 0 auto 14px auto;
  }

  .message-text {
    font-size: clamp(12px, 3.5vw, 13px);
    line-height: 1.9;
    color: #a5a2a0;
    font-weight: 300;
  }

  .message-text strong {
    color: #d8c8bd;
    font-weight: 400;
  }

  @media (max-height: 660px) {
    .photo-wrapper {
      width: min(55vw, 210px);
    }
    .message-box {
      margin-top: 14px;
    }
    .message-text {
      line-height: 1.6;
    }
  }
</style>
</head>
<body>

  <div class="glow"></div>

  <!-- Слой с падающими словами -->
  <div id="falling-words"></div>

  <div id="start-screen">
    <div class="subtitle">Особое послание</div>
    <div class="title">Лейли</div>
    <button class="btn" onclick="openCard()">Открыть</button>
  </div>

  <div id="content-screen">
    <div class="photo-wrapper">
      <img class="photo-img" src="img/leyli.jpg" alt="Лейли">
      <div class="mosaic-grid" id="mosaicGrid"></div>
    </div>

    <div class="message-box" id="messageBox">
      <div class="message-name">Лейли</div>
      <div class="line"></div>
      <p class="message-text">
        Ты — самое прекрасное и светлое, что есть в моей жизни.<br>
        Каждый день с тобой наполнен смыслом.<br>
        <strong>Я очень сильно тебя люблю.</strong>
      </p>
    </div>
  </div>

<script>
  /* ===== ПАДАЮЩИЕ СЛОВА ===== */
  const fallingContainer = document.getElementById('falling-words');
  const phrase = 'I love you';

  function spawnWord() {
    const word = document.createElement('div');
    word.classList.add('falling-word');
    word.textContent = phrase;

    // Случайные параметры для каждой надписи
    const size = 14 + Math.random() * 26;           // размер шрифта 14–40px
    const left = Math.random() * 95;                 // позиция по горизонтали (0–95%)
    const duration = 9 + Math.random() * 9;          // скорость падения 9–18 сек
    const opacity = (0.06 + Math.random() * 0.18).toFixed(2); // прозрачность
    const rotate = (Math.random() * 30 - 15).toFixed(1);      // наклон -15..15 град
    const drift = (Math.random() * 80 - 40).toFixed(0);       // смещение в сторону

    word.style.fontSize = size + 'px';
    word.style.left = left + '%';
    word.style.setProperty('--opacity', opacity);
    word.style.setProperty('--rotate', rotate + 'deg');
    word.style.setProperty('--drift', drift + 'px');
    word.style.animationDuration = duration + 's';

    fallingContainer.appendChild(word);

    // Удаляем слово, когда оно упало
    word.addEventListener('animationend', () => word.remove());
  }

  // Первое слово сразу, дальше — новое каждые 900 мс
  spawnWord();
  setInterval(spawnWord, 900);

  /* ===== МОЗАИКА ===== */
  const grid = document.getElementById('mosaicGrid');
  const cols = 8;
  const rows = 10;

  for (let i = 0; i < cols * rows; i++) {
    const tile = document.createElement('div');
    tile.classList.add('mosaic-tile');
    grid.appendChild(tile);
  }

  function openCard() {
    const startScreen = document.getElementById('start-screen');
    const contentScreen = document.getElementById('content-screen');
    const messageBox = document.getElementById('messageBox');

    startScreen.style.opacity = '0';

    setTimeout(() => {
      startScreen.style.display = 'none';
      contentScreen.classList.add('active');

      const tiles = Array.from(document.querySelectorAll('.mosaic-tile'));
      tiles.sort(() => Math.random() - 0.5);

      tiles.forEach((tile, index) => {
        setTimeout(() => tile.classList.add('hide'), index * 22);
      });

      setTimeout(() => {
        messageBox.classList.add('visible');
      }, 1000);
    }, 800);
  }
</script>

</body>
</html>
